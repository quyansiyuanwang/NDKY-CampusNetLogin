name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-dist
      - run: dist build --artifacts=local
      - uses: softprops/action-gh-release@v2
        with:
          files: target/distrib/*
